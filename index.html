<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-version" content="__APP_VERSION__" />
    <meta name="build-time" content="__BUILD_TIMESTAMP__" />
    <link rel="icon" href="https://lumi.new/lumi.ing/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Dépannage_entretien - Gestion de Maintenance et Entretien</title>
    <meta name="description" content="Application professionnelle Dépannage_entretien : gestion de maintenance, dépannage, entretien et interventions de terrain">
    <script>
      (function() {
        try {
          // 1. Nettoyage de l'éventuel marqueur temporaire _v dans l'URL après chargement complet
          if (window.location && window.location.search && window.location.search.indexOf('_v=') !== -1) {
            window.addEventListener('load', function() {
              setTimeout(function() {
                try {
                  var cleanUrl = window.location.pathname + window.location.search.replace(/[?&]_v=[^&]+/, '').replace(/^&/, '?') + window.location.hash;
                  if (window.history && window.history.replaceState) {
                    window.history.replaceState(null, '', cleanUrl || '/');
                  }
                } catch (e) {}
              }, 1500);
            });
          }
          // 3. Désenregistrement inconditionnel de tout Service Worker résiduel ou PWA
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          // 4. Purge absolue de CacheStorage (évite tout HTML ou script figé dans les caches hors-ligne)
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }
          // 5. Gestionnaire d'erreur de préchargement de chunks Vite (lors d'un nouveau déploiement)
          window.addEventListener('vite:preloadError', function(event) {
            console.warn('Vite preload error détectée (nouveau bundle disponible) - actualisation immédiate...');
            window.location.reload();
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
