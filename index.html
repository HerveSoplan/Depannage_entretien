<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="https://lumi.new/lumi.ing/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Dépannage_entretien - Gestion de Maintenance et Entretien</title>
    <meta name="description" content="Application professionnelle Dépannage_entretien : gestion de maintenance, dépannage, entretien et interventions de terrain">
    <script>
      (function() {
        try {
          // 1. Redirection soplan vers domaine officiel
          if (typeof window !== 'undefined' && window.location && window.location.hostname) {
            if (window.location.hostname.indexOf('soplan') !== -1) {
              var target = 'https://depannage-entretien.vercel.app' + window.location.pathname + window.location.search + window.location.hash;
              window.location.replace(target);
              return;
            }
          }
          // 2. Nettoyage de l'éventuel marqueur temporaire _v dans l'URL pour garder une URL propre
          if (window.location && window.location.search && window.location.search.indexOf('_v=') !== -1) {
            var cleanUrl = window.location.pathname + window.location.search.replace(/[?&]_v=[^&]+/, '').replace(/^&/, '?') + window.location.hash;
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, '', cleanUrl || '/');
            }
          }
          // 3. Désenregistrement inconditionnel de tout Service Worker résiduel ou PWA
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          // 4. Purge absolue de CacheStorage (évite tout HTML ou script figé dans les caches hors-ligne)
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
